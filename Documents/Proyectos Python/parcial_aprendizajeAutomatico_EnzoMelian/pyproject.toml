[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "parcial_aprendizajeautomatico_enzomelian"
version = "0.0.1"
description = "Modelo descriptivo y segmentacion de la matriz minera argentina"
authors = [
  { name = "Enzo Melian" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["parcial_aprendizajeautomatico_enzomelian"]
include = ["pyproject.toml", "parcial_aprendizajeautomatico_enzomelian/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["parcial_aprendizajeautomatico_enzomelian"]
force-sort-within-sections = true

